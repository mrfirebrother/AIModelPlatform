[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-platform-backend"
version = "0.1.0"
description = "Runtime skeleton for the AI model platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2",
    "celery>=5.4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "redis>=5,<6",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "anyio>=4.6,<5",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
