<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>轮子标注台</title>
  <link rel="stylesheet" href="./app.css?v=5" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="kicker">Axle bench</span>
      <h1>轮子标注台</h1>
    </div>
    <div class="folder-bar">
      <label class="path">
        <span>图片文件夹</span>
        <span id="folder" class="folder-current">未打开</span>
      </label>
      <button type="button" id="pick" class="primary">文件夹</button>
    </div>
    <div id="stats" class="stats">未打开</div>
  </header>
  <main>
    <aside class="rail">
      <div class="rail-tools">
        <input id="query" placeholder="筛选文件名" />
        <div class="seg" id="filter">
          <button type="button" data-filter="all" class="on">全部</button>
          <button type="button" data-filter="todo">未看</button>
          <button type="button" data-filter="done">已看</button>
        </div>
      </div>
      <div id="list"></div>
    </aside>
    <section id="stage">
      <canvas id="view"></canvas>
      <div id="empty">
        <p class="empty-kicker">01</p>
        <h2>先打开现场图片文件夹</h2>
        <p>自动提议会按圆找出轮子。你只改漏框、错框和备胎。标注写在该文件夹的 labels 目录，原图不动。</p>
      </div>
    </section>
    <aside class="side">
      <section>
        <h2>这一张</h2>
        <p id="meta" class="meta">还没有图片</p>
        <label class="check"><input id="lower-only" type="checkbox" checked /> 只在画面中下部找轮子</label>
        <label class="slider">
          <span>严格<span>宽松</span></span>
          <input id="loose" type="range" min="18" max="70" value="40" />
        </label>
        <div class="actions">
          <button type="button" id="propose" class="primary">自动提议</button>
          <button type="button" id="prev">上一张</button>
          <button type="button" id="next">下一张</button>
          <button type="button" id="clear">清空框</button>
          <button type="button" id="forget">标为未看</button>
          <button type="button" id="export">导出 YOLO</button>
        </div>
        <p id="status" class="status">拖空白处画框。G 自动提议，Ctrl+Z 撤销。</p>
      </section>
      <section>
        <ol id="boxes"></ol>
      </section>
      <section>
        <h2>手势</h2>
        <ul class="keys">
          <li><b>拖拽</b>画框，拖框移动，拖角缩放</li>
          <li><b>滚轮</b>缩放，<b>中键</b>平移</li>
          <li><b>Delete</b>删除选中</li>
          <li><b>← →</b>上一张 / 下一张</li>
          <li><b>G</b>自动提议，<b>Ctrl+Z</b>撤销</li>
        </ul>
      </section>
    </aside>
  </main>
  <script src="./app.js?v=5"></script>
<div id="browser" class="browser hide">
  <div class="browser-panel">
    <div class="browser-head">
      <span id="browser-path">选择文件夹</span>
      <button type="button" id="browser-close">×</button>
    </div>
    <div class="browser-body" id="browser-list"></div>
    <div class="browser-foot">
      <button type="button" id="browser-parent">回到驱动器</button>
      <button type="button" id="browser-choose" class="primary">选这个文件夹</button>
    </div>
  </div>
</div>
</body>
</html>
