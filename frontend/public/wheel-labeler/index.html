<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <title>图片标注台</title>
  <link rel="stylesheet" href="./app.css?v=26" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="kicker">Label bench</span>
      <h1>图片标注台</h1>
    </div>
    <div class="head-actions">
      <button type="button" id="pick" class="primary">上传图片</button>
    </div>
    <div id="stats" class="hide"></div>
  </header>
  <main>
    <aside class="rail">
      <div class="rail-tools">
        <input id="query" placeholder="筛选文件名" />
        <div class="seg" id="filter">
          <button type="button" data-filter="all" class="on">全部</button>
          <button type="button" data-filter="todo">未看</button>
          <button type="button" data-filter="done">已看</button>
        </div>
      </div>
      <div id="list"></div>
    </aside>
    <section id="stage">
      <canvas id="view"></canvas>
      <div id="caption" class="hide"></div>
      <div id="empty">
        <p class="empty-kicker">01</p>
        <h2>先打开现场图片文件夹</h2>
        <p>“找圆提议”只对圆形目标有效，其他目标直接手画。你只改漏框、错框。标注写在该文件夹的 labels 目录，原图不动。</p>
        <p><button type="button" id="empty-pick" class="primary">选择本地文件夹上传</button></p>
      </div>
    </section>
    <aside class="side">
      <section>
        <div class="cls-row">
          <select id="class-select" title="当前类别：新画的框都归它"></select>
        </div>
        <div class="cls-row">
          <input id="class-input" placeholder="新类别名" />
          <button type="button" id="class-add">添加</button>
          <button type="button" id="class-rename">改名</button>
        </div>
        <label class="check"><input id="lower-only" type="checkbox" /> 只在画面中下部找目标</label>
        <label class="slider">
          <span>严格<span>宽松</span></span>
          <input id="loose" type="range" min="18" max="70" value="40" />
        </label>
        <div class="actions">
          <button type="button" id="propose" class="primary">找圆提议</button>
          <button type="button" id="prev">上一张</button>
          <button type="button" id="next">下一张</button>
          <button type="button" id="clear">清空框</button>
          <button type="button" id="forget">标为未看</button>
          <button type="button" id="export">导出 YOLO</button>
        </div>
        <p id="status" class="status">拖空白处画框。G 找圆提议，Ctrl+Z 撤销。</p>
        <ol id="boxes"></ol>
      </section>
      <section>
        <h2>手势</h2>
        <ul class="keys">
          <li><b>拖拽</b>画框，拖框移动，拖角缩放</li>
          <li><b>滚轮</b>缩放，<b>中键</b>平移</li>
          <li><b>Delete</b>删除选中</li>
          <li><b>← →</b>上一张 / 下一张</li>
          <li><b>右键</b>点框直接删除</li>
          <li><b>G</b>找圆提议，<b>Ctrl+Z</b>撤销</li>
          <li><b>1–9</b>切换当前类别，选中框同步改类</li>
        </ul>
      </section>
    </aside>
  </main>
  <input id="upload-input" type="file" webkitdirectory multiple class="hide" />
<script src="./app.js?v=26"></script>
</body>
</html>
